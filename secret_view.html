<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greentropik - View Secret</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --accent: #06b6d4;
            --dark: #0f172a;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
        }
        body {
            font-family: 'Sora', sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #0a0f1a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container { max-width: 700px; width: 100%; }
        .box {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .header { margin-bottom: 2rem; }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .meta { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 2rem; }
        .meta strong { color: var(--primary); }
        .secret-box {
            background: rgba(15, 23, 42, 0.9);
            border: 2px dashed rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            position: relative;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .secret-hidden { text-align: center; }
        .secret-hidden .lock-icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .secret-hidden p { color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem; }
        .secret-content {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            text-align: left;
            color: var(--primary);
            line-height: 1.6;
            display: none;
        }
        .secret-content.visible {
            display: block;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 2rem;
        }
        .btn {
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            flex: 1;
            min-width: 150px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }
        .btn-secondary {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .btn-secondary:hover { background: rgba(6, 182, 212, 0.2); }
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
        .progress { font-size: 0.85rem; color: var(--text-secondary); margin-top: 1rem; }
        .progress span { color: var(--primary); }
        .footer-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(16, 185, 129, 0.1);
        }
        .footer-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .footer-link a:hover {
            color: var(--primary);
        }
        @media (max-width: 600px) {
            .box { padding: 2rem 1.5rem; }
            .button-group { flex-direction: column; }
            .btn { min-width: 100%; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="header">
                <div class="icon">🔐</div>
                <h1>Greentropik Secret</h1>
            </div>
            
            <p class="meta loading" id="status">Loading secret...</p>
            
            <div class="secret-box" id="secret-box">
                <div class="secret-hidden" id="hiddenState">
                    <div class="lock-icon">🔒</div>
                    <p>Secret is encrypted and hidden</p>
                    <button class="btn btn-primary" onclick="revealSecret()">🔓 Reveal Secret</button>
                </div>
                <div class="secret-content" id="content"></div>
            </div>
            
            <div class="progress" id="progress" style="display: none;">
                Views: <span id="viewCount">0</span> of <span id="maxViews">1</span>
            </div>
            
            <div class="button-group" id="actions" style="display: none;">
                <button class="btn btn-primary" id="copyBtn" onclick="copySecret()">📋 Copy</button>
                <a href="/secrets" class="btn btn-secondary" style="text-decoration: none;">← Create Another</a>
                <button class="btn btn-danger" id="burnBtn" onclick="burnSecret()">🔥 Burn Secret</button>
            </div>

            <div class="footer-link">
                <a href="/">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const secretID = 'PLACEHOLDER_ID';
        let secretContent = '';
        let isRevealed = false;
        let secretLoaded = false;

        async function loadSecret() {
            try {
                const response = await fetch('/api/view', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: secretID })
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || 'Secret not found or expired');
                }

                const data = await response.json();
                secretContent = data.secret;
                
                document.getElementById('status').innerHTML = 
                    '<strong>' + data.type.toUpperCase() + '</strong> • Encrypted with 256-bit AES';
                document.getElementById('viewCount').textContent = data.view_count;
                document.getElementById('maxViews').textContent = data.max_views;
                document.getElementById('progress').style.display = 'block';
                document.getElementById('actions').style.display = 'flex';
                secretLoaded = true;
            } catch (error) {
                document.getElementById('status').className = 'error';
                document.getElementById('status').textContent = '❌ ' + error.message;
                document.getElementById('actions').style.display = 'none';
            }
        }

        function revealSecret() {
            // First time: load the secret from server
            if (!secretLoaded) {
                document.getElementById('status').textContent = 'Loading...';
                loadSecret();
                return;
            }

            if (isRevealed) return;
            isRevealed = true;
            
            document.getElementById('hiddenState').style.display = 'none';
            document.getElementById('content').classList.add('visible');
            document.getElementById('content').innerHTML = secretContent;
            
            setTimeout(() => {
                if (isRevealed) {
                    document.getElementById('content').classList.remove('visible');
                    document.getElementById('hiddenState').style.display = 'block';
                    isRevealed = false;
                    document.getElementById('hiddenState').innerHTML = 
                        '<div class="lock-icon">🔒</div><p>Secret auto-hidden (view again)</p><button class="btn btn-primary" onclick="revealSecret()">🔓 Reveal Secret</button>';
                }
            }, 10000);
        }

        // Only check if secret exists on page load, don't count as a view
        async function checkSecret() {
            // Just enable the UI without fetching the secret
            document.getElementById('status').innerHTML = 
                'Secret ready to reveal • Encrypted with 256-bit AES';
            document.getElementById('progress').style.display = 'block';
            document.getElementById('actions').style.display = 'flex';
            // Don't call /api/view here - that counts as a view!
            // Wait until user clicks "Reveal Secret"
        }

        function copySecret() {
            const textarea = document.createElement('textarea');
            textarea.value = secretContent;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            const btn = document.getElementById('copyBtn');
            const originalText = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => btn.textContent = originalText, 2000);
        }

        function burnSecret() {
            if (confirm('Are you sure? This will permanently delete the secret immediately.')) {
                console.log('Burning secret:', secretID);
                fetch('/api/burn', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: secretID })
                }).then(response => {
                    console.log('Burn response status:', response.status);
                    if (response.ok) {
                        // Hide all content
                        document.getElementById('progress').style.display = 'none';
                        document.getElementById('secret-box').style.display = 'none';
                        
                        // Update status
                        document.getElementById('status').textContent = '🔥 Secret has been permanently burned and deleted!';
                        document.getElementById('status').style.color = '#ef4444';
                        
                        // Replace actions
                        document.getElementById('actions').innerHTML = '<a href="/secrets" class="btn btn-secondary" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">← Back to Create</a>';
                    } else {
                        return response.text().then(text => {
                            console.error('Burn failed:', text);
                            alert('Error burning secret: ' + text);
                        });
                    }
                }).catch(error => {
                    console.error('Burn error:', error);
                    alert('Error: ' + error.message);
                });
            }
        }

        checkSecret();
    </script>
</body>
</html>
