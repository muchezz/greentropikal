services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greentropik-app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      BASE_URL: "http://localhost:8080"
      REDIS_URL: "redis:6379"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - greentropik-network

  redis:
    image: redis:7-alpine
    container_name: greentropik-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - greentropik-network
    volumes:
      - redis-data:/data

networks:
  greentropik-network:
    driver: bridge

volumes:
  redis-data: