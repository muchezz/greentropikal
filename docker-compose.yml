services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: njiralab
    ports:
      # Host port is configurable so it can dodge whatever else is on 8080:
      #   HOST_PORT=8081 docker compose up
      # The container always listens on 8080; only the host side moves.
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      # Set this to the public origin in production — it is used for canonical
      # URLs, the sitemap, and the links Vault hands back. It must match the
      # host port above, or the links Vault generates will point at the wrong
      # place.
      BASE_URL: "http://localhost:${HOST_PORT:-8080}"
      REDIS_URL: "redis:6379"
      # Fill these in once the destinations exist.
      # STUDYZORA_URL: "https://…"
      # CONTACT_EMAIL: "hello@…"
      # Behind a TLS-terminating proxy, set both of these:
      # ENABLE_HSTS: "true"
      # TRUST_PROXY: "true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - njiralab

  redis:
    image: redis:7-alpine
    container_name: njiralab-redis
    # Vault records are short-lived by design and expiry is enforced by Redis
    # itself, so nothing is persisted to disk. Secrets never touch a volume.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - njiralab

networks:
  njiralab:
    driver: bridge
